[project]
name = "appysetty"
version = "0.1.0"
description = "Simplistic config helper"
license = "MIT"
readme = "README.md"
authors = [
    { name = "k_zoltner", email = "kuno.zoltner@smartfactory.de" }
]
requires-python = ">=3.12"
dependencies = [
    "PyYAML==6.0.3"
]

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "pyyaml>=6.0.3",
]

[tool.uv]
link-mode = "copy"
